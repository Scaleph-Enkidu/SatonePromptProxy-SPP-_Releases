name: Verify historical CP14-9 pair

# Historical verification only. This retired workflow has no automatic trigger,
# release creation, publication, asset replacement, or latest-release mutation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: AIChat-v1.16.23_SPP-v5.8.26
      PACKAGE_DIR: packages/AIChat_v1.16.23_SPP_v5.8.26
      MANIFEST: releases/AIChat_v1.16.23_SPP_v5.8.26.json
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify existing historical release without changing it
        shell: bash
        run: |
          set -euo pipefail
          check_dir="$(mktemp -d "$RUNNER_TEMP/cp14-9-check.XXXXXX")"
          gh release download "$TAG" --dir "$check_dir"
          python3 tools/verify_cp14_release.py --assets-dir "$check_dir"
          cmp "$MANIFEST" "$check_dir/$(basename "$MANIFEST")"
          echo "Historical release verified. No release state was changed."
