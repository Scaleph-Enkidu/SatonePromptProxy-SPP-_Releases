name: Publish verified plugin pair

# Release assets must be uploaded to a draft first. This workflow never builds,
# creates tags/releases, replaces assets, or changes an existing public release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft or published release tag
        required: true
        default: AIChat-v1.17.1_SPP-v5.9.1
        type: string
      manifest:
        description: Committed manifest to compare against uploaded assets
        required: true
        default: releases/AIChat_v1.17.1_SPP_v5.9.1.json
        type: string

permissions:
  contents: write

concurrency:
  group: verified-plugin-pair-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
      MANIFEST: ${{ inputs.manifest }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test release verifier
        run: python3 -m unittest discover -s tools -p 'test_verify_release.py'
      - name: Download existing release and verify every original byte
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MANIFEST"
          # A missing draft/release is an error; do not create a replacement.
          gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-was-draft"
          check_dir="$(mktemp -d "$RUNNER_TEMP/satone-verified.XXXXXX")"
          gh release download "$TAG" --dir "$check_dir"
          python3 tools/verify_release.py --manifest "$MANIFEST" --assets-dir "$check_dir" --tag "$TAG"
          cmp "$MANIFEST" "$check_dir/$(basename "$MANIFEST")"
      - name: Publish only the verified draft
        shell: bash
        run: |
          set -euo pipefail
          was_draft="$(cat "$RUNNER_TEMP/release-was-draft")"
          is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [[ "$was_draft" == true && "$is_draft" == true ]]; then
            gh release edit "$TAG" --draft=false --latest
          else
            echo "Existing published release verified; its assets, notes and latest designation remain unchanged."
          fi
